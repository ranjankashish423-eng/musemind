<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>MuseMind</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<h1>MuseMind AI Journal</h1>

<!-- LOGIN -->
<div class="box" id="loginBox">
    <h2>Create Profile</h2>

    <input id="name" placeholder="Enter your name">
    <input type="number" id="age" placeholder="Enter your age">

    <select id="gender">
        <option value="">Select Gender</option>
        <option>Male</option>
        <option>Female</option>
        <option>Other</option>
    </select>

    <button onclick="login()">Start Journaling</button>
</div>

<!-- APP -->
<div id="app" style="display:none;">

    <h2 id="welcome"></h2>

    <div class="box">
        <textarea id="entry" placeholder="Write your feelings..."></textarea>
        <button onclick="analyzeEmotion()">Analyze</button>
        <p id="result"></p>
    </div>

    <!-- HISTORY -->
    <div class="box">
        <h3>Your Journal History</h3>
        <div id="historyBox"></div>
    </div>

    <div class="box">
        <h3>Dashboard</h3>
        <div id="dashboard"></div>
        <canvas id="chart"></canvas>
    </div>

    <button onclick="logout()">Logout</button>

</div>

<script src="script.js"></script>

</body>
</html>
